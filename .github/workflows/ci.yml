name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q harness rulkit tools tests contest_baselines

      # The interpreter has to be one the project supports: the SDK
      # declares ``requires-python >=3.10`` and the image is built
      # from ``python:3.12-slim-bookworm``.  Checking it here means a
      # matrix entry that silently drifts off the supported range is
      # red rather than silently different from what the graders run.
      - name: The interpreter is one the project supports
        run: python tools/check_env.py

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Verify the committed evidence ledger still chains
        run: python tools/verify_ledger.py --ledger evidence/ledger.jsonl

      # The manifest is the inventory of what the repository ships.  It
      # used to be generated from the working tree, so it named files
      # git ignores and a fresh checkout failed the check below with
      # "manifest lists a missing file" on every push.  This step asks
      # the question directly: does the manifest agree with the
      # checkout?
      - name: Verify the manifest describes this checkout
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          from refresh_manifest import SKIP_DIRS, SKIP_FILES, SKIP_NAMES

          manifest = json.loads(
              Path("MANIFEST.json").read_text(encoding="utf-8"))
          # Only **tracked** files count.  The manifest describes the
          # commit, and a fresh checkout of that commit contains
          # exactly the tracked files - so a file that is merely
          # present in some developer's working tree (a research run,
          # a scratch note) must not decide whether this check
          # passes.  Asking for untracked files too made the check
          # answer a different question on a laptop than it answers
          # here.
          tracked = set(
              name for name in subprocess.run(
                  ["git", "ls-files", "-z", "--cached"],
                  capture_output=True, check=True
              ).stdout.decode("utf-8", "replace").split("\0") if name
          )
          listed = set(manifest.get("files") or {})

          def shipped(name):
              # The generator's own skip lists decide what is shipped;
              # reusing them here keeps the two in step.
              parts = name.split("/")
              return (name not in SKIP_NAMES
                      and name not in SKIP_FILES
                      and not any(part in SKIP_DIRS for part in parts))

          missing = sorted(listed - tracked)
          if missing:
              raise SystemExit(
                  "FAIL  MANIFEST.json lists %d file(s) this checkout does "
                  "not have; regenerate it with "
                  "`python tools/refresh_manifest.py`: %s"
                  % (len(missing), missing[:5]))
          unlisted = sorted(name for name in tracked - listed if shipped(name))
          if unlisted:
              raise SystemExit(
                  "FAIL  %d tracked file(s) are absent from MANIFEST.json; "
                  "regenerate it with `python tools/refresh_manifest.py`: %s"
                  % (len(unlisted), unlisted[:5]))
          print("OK  the manifest describes this checkout (%d files)" % len(listed))
          PY

      - name: Verify the repository ships no model weights
        run: python tools/verify_repo.py --dir .

      # The working tree holds the local research runs and their weights;
      # the **commit** must not.  A weight in the history cannot be
      # removed without rewriting it, so this is checked on every push.
      - name: Verify git tracks no model weight
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from pathlib import Path
          from verify_repo import _tracked_weights

          weights = _tracked_weights(Path("."))
          if weights:
              raise SystemExit("FAIL  git tracks model weights: %s" % weights)
          print("OK  git tracks no model weight")
          PY
      # The hook that refuses such a commit travels with the repository,
      # so a fresh clone gets it too.
      - name: Install the weight guard hook
        run: python tools/install_git_hooks.py

      - name: Render the recorded decision table
        run: python tools/show_run.py --workspace evidence

  image:
    name: the submission image presents exactly one entry point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The platform's inspection of the image is what the previous
      # submission failed on: the archive shipped four candidate entries
      # and a package that shadowed the SDK entry point.  These checks
      # make that defect impossible to reintroduce.
      - name: The archive layout keeps a single, unambiguous entry point
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "tools")
          import build_docker_image as b

          items = b._collect_project()
          b._assert_single_entry(items)
          print("OK  one entry point, no shadowing package")
          PY

      - name: The SDK entry point answers describe
        run: python harness.py describe
