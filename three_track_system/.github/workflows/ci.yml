name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q harness rulkit tools tests

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Verify the committed evidence ledger still chains
        run: python tools/verify_ledger.py --ledger evidence/ledger.jsonl

      - name: Verify the repository ships no model weights
        run: python tools/verify_repo.py --dir .

      - name: Render the recorded decision table
        run: python tools/show_run.py --workspace evidence
